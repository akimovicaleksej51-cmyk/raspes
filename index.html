<html lang="ru">
<head>

<title>Расписание 312</title>

<link rel="icon" type="image/png" href="icon-192.png">

<script src="config.js"></script>
<style>
/* Layout: phone app — header on top, content stack, tab bar fixed at the bottom */
:root{
  --bg:#eef1f4; --surface:#ffffff; --fg:#17202a; --muted:#5f6b78; --line:#d9dee5;
  --accent:#1f5f8b; --accent-ink:#ffffff; --accent-soft:#dde9f2;
  --lec:#2d6cdf; --lec-bg:#e3ecfc; --sem:#8a4fc4; --sem-bg:#f0e7fa;
  --pr:#1e8a5a; --pr-bg:#e1f3ea; --lab:#c4661a; --lab-bg:#fbeadb;
  --bad:#c23b3b; --bad-bg:#fbe4e4; --cur:#e0a100;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#18212a; --fg:#e7edf3; --muted:#93a1ae; --line:#2a3642;
  --accent:#6fb3e3; --accent-ink:#0b1620; --accent-soft:#1c3346;
  --lec:#86acf5; --lec-bg:#1d2a44; --sem:#c39bef; --sem-bg:#2c2140;
  --pr:#6fd1a2; --pr-bg:#163126; --lab:#f0a565; --lab-bg:#3a2717;
  --bad:#f08a8a; --bad-bg:#3d1f1f; --cur:#f5c542; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#18212a; --fg:#e7edf3; --muted:#93a1ae; --line:#2a3642;
  --accent:#6fb3e3; --accent-ink:#0b1620; --accent-soft:#1c3346;
  --lec:#86acf5; --lec-bg:#1d2a44; --sem:#c39bef; --sem-bg:#2c2140;
  --pr:#6fd1a2; --pr-bg:#163126; --lab:#f0a565; --lab-bg:#3a2717;
  --bad:#f08a8a; --bad-bg:#3d1f1f; --cur:#f5c542; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{padding-block:12px 10px;display:flex;flex-direction:column;gap:12px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.01em}
.brand span{font-size:12px;color:var(--muted)}
.icon-btn{border:1px solid var(--line);background:transparent;border-radius:10px;width:38px;height:38px;display:grid;place-items:center;flex:none}
.icon-btn:disabled{opacity:.35}
.icon-btn svg{width:20px;height:20px}

.weekbar{display:flex;align-items:center;gap:8px}
.weekinfo{flex:1;text-align:center;min-width:0}
.weekinfo .n{font-family:var(--display);font-weight:500;font-size:17px}
.weekinfo .d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill-btn{border:none;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;flex:none}

.days{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.day{border:1px solid var(--line);background:transparent;border-radius:12px;padding:6px 0 7px;display:flex;flex-direction:column;align-items:center;gap:1px}
.day .w{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.day .num{font-family:var(--display);font-weight:500;font-size:16px;font-variant-numeric:tabular-nums}
.day .cnt{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.day.is-today .num{color:var(--accent)}
.day[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day[aria-selected="true"] .w,.day[aria-selected="true"] .cnt,.day[aria-selected="true"].is-today .num{color:var(--accent-ink)}

.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:2px}
.seg button{border:none;background:transparent;border-radius:8px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg.wide{width:100%}
.seg.wide button{flex:1;padding:7px 8px}
.filters .lbl{font-size:12px;color:var(--muted);font-weight:600}
.toggle{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}

main .wrap{padding-block:14px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dayhead h1,h1.title{font-family:var(--display);font-weight:500;font-size:19px;margin:0;text-wrap:balance}
.dayhead small{color:var(--muted);font-size:13px}

.slot{display:grid;grid-template-columns:58px 1fr;gap:10px}
.time{padding-top:12px;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:2px}
.time .p{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.time b{font-size:15px}
.time span{font-size:12px;color:var(--muted)}
.lessons{display:flex;flex-direction:column;gap:8px;min-width:0}
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 13px 12px;display:flex;flex-direction:column;gap:5px;min-width:0;text-align:left;width:100%}
.lesson.now{border-color:var(--cur);box-shadow:0 0 0 1px var(--cur)}
.lesson.off{opacity:.45}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.t-l{color:var(--lec);background:var(--lec-bg)} .t-s{color:var(--sem);background:var(--sem-bg)}
.t-p{color:var(--pr);background:var(--pr-bg)} .t-b{color:var(--lab);background:var(--lab-bg)}
.t-k{color:var(--accent);background:var(--accent-soft)}
.chip.sub{color:var(--fg);background:var(--bg);border:1px solid var(--line)}
.chip.nowchip{color:#3a2a00;background:var(--cur)}
.chip.bad{color:var(--bad);background:var(--bad-bg)}
.chip.ok{color:var(--pr);background:var(--pr-bg)}
.chip.mute{color:var(--muted);background:var(--bg);border:1px dashed var(--line)}
.lesson h3{margin:0;font-size:15px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.lesson .who{font-size:13px;color:var(--muted)}
.lesson .wk{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.empty-slot{border:1px dashed var(--line);border-radius:14px;padding:12px 13px;color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.free{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 18px;text-align:center;display:flex;flex-direction:column;gap:6px}
.free b{font-family:var(--display);font-weight:500;font-size:18px}
.free span{color:var(--muted);font-size:14px}
.note{font-size:12px;color:var(--muted);line-height:1.5}

/* cabinet */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--display);font-weight:500;font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted);font-weight:600;line-height:1.25}
.stat.total b{color:var(--accent)} .stat.n b{color:var(--bad)} .stat.u b{color:var(--pr)}
.month{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:4px}
.abs{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 13px;display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:start}
.abs .dt{display:flex;flex-direction:column;font-variant-numeric:tabular-nums}
.abs .dt b{font-family:var(--display);font-weight:500;font-size:18px;line-height:1.1}
.abs .dt span{font-size:11px;color:var(--muted);font-weight:600}
.abs .info{min-width:0;display:flex;flex-direction:column;gap:3px}
.abs .info b{font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.abs .info span{font-size:12px;color:var(--muted)}
.abs .h{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.me-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.me-head h1{font-family:var(--display);font-weight:500;font-size:19px;margin:0;line-height:1.25}
.me-head p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.sync{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.link-btn{border:none;background:none;color:var(--accent);font-weight:700;font-size:13px;padding:4px 0}
.banner{border-radius:12px;padding:10px 12px;font-size:13px;background:var(--accent-soft);color:var(--fg)}
.banner.warn{background:var(--bad-bg)}

/* login */
.login{display:flex;flex-direction:column;gap:12px}
.login h1{font-family:var(--display);font-weight:500;font-size:20px;margin:0}
.login p{margin:0;color:var(--muted);font-size:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700}
.field input{font:inherit;font-size:18px;letter-spacing:.08em;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.err{color:var(--bad);font-size:13px;font-weight:600;min-height:1em}
.btn{border:none;border-radius:12px;padding:13px;font-weight:700;font-size:15px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--bg);color:var(--fg)}
.btn:disabled{opacity:.5}

/* journal list */
.jl{display:flex;flex-direction:column;gap:8px}
.jl .lesson{cursor:pointer}
.status{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}
.status .go{font-size:13px;font-weight:700;color:var(--accent)}
.st-row{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 13px;display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left}
.st-row .nm{min-width:0;display:flex;flex-direction:column}
.st-row .nm b{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.st-row .nm span{font-size:12px;color:var(--muted)}
.st-row .hv{font-variant-numeric:tabular-nums;text-align:right;flex:none}
.st-row .hv b{font-family:var(--display);font-weight:500;font-size:17px}
.st-row .hv span{display:block;font-size:11px;color:var(--muted)}

/* bottom tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:flex;gap:4px;padding-block:6px}
nav.tabs button{flex:1;border:none;background:transparent;border-radius:12px;padding:6px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,15,20,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;display:flex;flex-direction:column;max-height:92vh;max-height:92dvh}
.sheet-h{padding:16px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.sheet-h h2{font-family:var(--display);font-weight:500;font-size:16px;margin:0;line-height:1.3}
.sheet-h p{margin:0;font-size:13px;color:var(--muted)}
.sheet-b{overflow:auto;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.sheet-f{padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);display:flex;gap:8px}
.sheet-f .btn{flex:1}
.counter{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:600}
.att{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.att:last-child{border-bottom:none}
.att label{flex:1;display:flex;align-items:center;gap:12px;min-width:0;cursor:pointer}
.att input[type=checkbox]{width:24px;height:24px;flex:none;accent-color:var(--pr)}
.att .nm{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.att.absent .nm{color:var(--bad)}
.exc{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;color:var(--muted);flex:none}
.exc[aria-pressed="true"]{background:var(--pr-bg);border-color:var(--pr);color:var(--pr)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.lesson{transition:opacity .15s}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand"><b id="hTitle">312 группа</b><span id="hSub">3 курс · ФКиСКД · V семестр 2026/27</span></div>
    <div id="schedControls" style="display:flex;flex-direction:column;gap:12px">
      <div class="weekbar">
        <button class="icon-btn" id="prevW" aria-label="Предыдущая неделя"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <div class="weekinfo"><div class="n" id="wNum"></div><div class="d" id="wDates"></div></div>
        <button class="pill-btn" id="todayBtn">Сегодня</button>
        <button class="icon-btn" id="nextW" aria-label="Следующая неделя"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>

          <button data-sub="1" aria-pressed="false">1</button>
          <button data-sub="2" aria-pressed="false">2</button>

      <div class="filters">
        <span class="lbl">Спецкурс</span>
        <div class="seg" id="strSeg">
          <button data-str="" aria-pressed="true">Все</button>
          <button data-str="грим" aria-pressed="false">Грим</button>
          <button data-str="досуг" aria-pressed="false">Досуг</button>
        </div>
      </div>
    </div>
  </div>
</header>

<main><div class="wrap" id="list"></div></main>

<nav class="tabs" aria-label="Разделы">
  <div class="wrap">
    <button data-view="sched" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Расписание</button>
    <button data-view="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Пропуски</button>
    <button data-view="journal" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h12a2 2 0 0 1 2 2v16H7a2 2 0 0 1-2-2z"/><path d="M5 19a2 2 0 0 1 2-2h12M9 8l2 2 4-4"/></svg>Журнал</button>
  </div>
</nav>

<div class="sheet-bg" id="sheet" hidden><div class="sheet" role="dialog" aria-modal="true" id="sheetBox"></div></div>

<script>

 [0,2,"MP","l","2-4",ROG],[0,2,"MP","s","5-7,17-18",KRA],[0,2,"MP","p","8-16",KRA,1],[0,2,"MP","p","8-16",BAI,2],
 [0,3,"MP","l","2",ROG],[0,3,"DOO","l","3-6",KAM],[0,3,"DOO","p","7-17",KAM],[0,3,"TAN","p","7-17",KOCH,2],

    const b=document.createElement("button");b.className="lesson";
    b.innerHTML=`<div class="row"><span class="chip sub">${l.pair} пара · ${PAIRS[l.pair][0]}</span><span class="chip ${tc}">${tn}</span>${audChip(l)}</div><h3>${l.subj}</h3><div class="status">${st}<span class="go">Отметить ›</span></div>`;
    b.onclick=()=>openMark(l,date);
    jl.appendChild(b);
  });
  box.appendChild(jl);
  if(!session.students||!session.students.length)box.insertAdjacentHTML("beforeend",`<div class="banner warn">Список студентов не загрузился. Откройте вкладку «Пропуски» с интернетом.</div>`);
}
async function jLoad(){
  if(view!=="journal"||!isBoss())return;
  flushQueue();
  if(jTab==="sum"){loadSummary();return}
  const date=jDate();jBusy=true;jErr="";render();
  try{const j=await api("day",{date});jDayCache[date]={marked:j.marked,absences:j.absences};const keys=Object.keys(jDayCache).sort().slice(-40);const c={};keys.forEach(k=>c[k]=jDayCache[k]);jDayCache=c;store.set("jday",jDayCache)}
  catch(x){jErr=x.code==="net"?"нет интернета":x.message}
  jBusy=false;if(view==="journal"&&jDate()===date)render();
}
function openMark(l,date){
  const key=lessonKey(l,date),roster=rosterFor(l);
  const pend=queue.find(q=>q.lesson.key===key);
  const prev={};
  if(pend)pend.absent.forEach(a=>prev[a.id]=a.reason);
  else{const c=jDayCache[date];if(c)c.absences.filter(a=>a.key===key).forEach(a=>prev[a.id]=a.reason)}
  const state=roster.map(s=>({id:s.id,name:s.name,absent:prev[s.id]!==undefined,reason:prev[s.id]||"n"}));
  const dt=fromIso(date),[tn]=TYPES[l.type];
  const box=$("sheetBox");
  box.innerHTML=`<div class="sheet-h"><h2>${l.subj}</h2><p>${DAYS[jDay]}, ${dt.getDate()} ${MONTHS[dt.getMonth()]} · ${l.pair} пара · ${tn}${l.aSub||l.aStr?" · "+audLabel(l):""}</p><div class="counter"><span id="cnt"></span><button class="link-btn" id="allHere">Все присутствуют</button></div></div><div class="sheet-b" id="attList"></div><div class="sheet-f"><button class="btn ghost" id="mCancel">Отмена</button><button class="btn primary" id="mSave">Сохранить</button></div>`;
  const al=$("attList");
  function draw(){
    al.innerHTML="";
    state.forEach((s,i)=>{
      const row=document.createElement("div");row.className="att"+(s.absent?" absent":"");
      row.innerHTML=`<label><input type="checkbox" id="att${s.id}" ${s.absent?"":"checked"}><span class="nm">${esc(shortName(s.name))}</span></label>${s.absent?`<button class="exc" aria-pressed="${s.reason==="u"}">Уважит.</button>`:""}`;
      row.querySelector("input").onchange=e=>{s.absent=!e.target.checked;if(!s.absent)s.reason="n";draw()};
      const ex=row.querySelector(".exc");if(ex)ex.onclick=()=>{s.reason=s.reason==="u"?"n":"u";draw()};
      al.appendChild(row);
    });
    const ab=state.filter(s=>s.absent).length;
    $("cnt").textContent=`Присутствуют ${state.length-ab} из ${state.length}`+(ab?` · нет ${ab}`:"");
  }
  draw();
  $("allHere").onclick=()=>{state.forEach(s=>{s.absent=false;s.reason="n"});draw()};
  $("mCancel").onclick=closeSheet;
  $("mSave").onclick=()=>{
    const payload={lesson:{key,date,week:jWeek,day:jDay,pair:l.pair,subject:l.subj,type:l.type,typeName:tn,sub:l.sub,audLabel:audLabel(l)},absent:state.filter(s=>s.absent).map(s=>({id:s.id,reason:s.reason}))};
    queue=queue.filter(q=>q.lesson.key!==key);queue.push(payload);store.set("queue",queue);
    const c=jDayCache[date]||{marked:[],absences:[]};
    c.absences=c.absences.filter(a=>a.key!==key).concat(payload.absent.map(a=>({key,id:a.id,reason:a.reason})));
    jDayCache[date]=c;store.set("jday",jDayCache);
    closeSheet();render();flushQueue(true);
  };
  $("sheet").hidden=false;
}
function closeSheet(){$("sheet").hidden=true;$("sheetBox").innerHTML=""}
$("sheet").onclick=e=>{if(e.target.id==="sheet")closeSheet()};
let flushing=false;
async function flushQueue(announce){
  if(flushing||!queue.length||!isBoss())return;flushing=true;
  let sent=0,failed=false;
  while(queue.length){
    const q=queue[0];
    try{const j=await api("save",q);
      const c=jDayCache[q.lesson.date]||{marked:[],absences:[]};c.marked=c.marked.filter(m=>m.key!==q.lesson.key).concat([{key:q.lesson.key,count:j.count,at:j.at}]);jDayCache[q.lesson.date]=c;store.set("jday",jDayCache);
      queue.shift();store.set("queue",queue);sent++;}
    catch(x){if(x.code==="auth"){logout();break}failed=true;break}
  }
  flushing=false;
  if(announce){toast(failed?"Нет интернета. Отметка сохранена на телефоне и отправится позже":"Сохранено")}
  if(sent&&view==="journal")render();
}
async function loadSummary(){
  jBusy=true;jErr="";render();
  try{const j=await api("summary");summary={students:j.students,at:Date.now()};store.set("summary",summary)}
  catch(x){jErr=x.code==="net"?"Нет интернета":x.message}
  jBusy=false;if(view==="journal")render();
}
function renderSummary(box){
  const at=summary&&summary.at?new Date(summary.at):null;
  box.insertAdjacentHTML("beforeend",`<div class="sync"><span>${jBusy?"Загрузка…":jErr?esc(jErr):at?"Обновлено "+at.toLocaleString("ru-RU",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):""}</span><button class="link-btn" id="sumRefresh">Обновить</button></div>`);
  $("sumRefresh").onclick=loadSummary;
  if(!summary){box.insertAdjacentHTML("beforeend",`<div class="free"><b>Нет данных</b><span>Нужен интернет, чтобы загрузить итоги</span></div>`);return}
  const all=summary.students.reduce((t,s)=>t+s.hours,0);
  box.insertAdjacentHTML("beforeend",`<div class="note">Всего по группе пропущено ${all} ${plural(all,"час","часа","часов")}. Нажмите на студента, чтобы увидеть его пропуски.</div>`);
  summary.students.forEach(s=>{
    const b=document.createElement("button");b.className="st-row";
    b.innerHTML=`<span class="nm"><b>${esc(s.name)}</b><span>${groupsText(s)||"группы не указаны"}</span></span><span class="hv"><b>${s.hours} ч</b><span>${s.excused?"уважит. "+s.excused+" ч":"&nbsp;"}</span></span>`;
    b.onclick=()=>openStudent(s);
    box.appendChild(b);
  });
}
async function openStudent(s){
  const box=$("sheetBox");
  box.innerHTML=`<div class="sheet-h"><h2>${esc(s.name)}</h2><p>Загрузка…</p></div><div class="sheet-b"></div><div class="sheet-f"><button class="btn ghost" id="sClose">Закрыть</button></div>`;
  $("sClose").onclick=closeSheet;$("sheet").hidden=false;
  try{const j=await api("student",{id:s.id});
    box.querySelector(".sheet-h p").textContent=groupsText(s)||"группа 312";
    box.querySelector(".sheet-b").innerHTML=statsHTML(absTotals(j.absences))+absListHTML(j.absences);}
  catch(x){box.querySelector(".sheet-h p").textContent=x.code==="net"?"Нет интернета":x.message}
}

// ================= часы, обновления, офлайн =================
function tick(){
  const [pw,pd]=todayView();const wasToday=(week===pw&&day===pd);
  now=new Date();todayW=weekOf(now);todayD=(now.getDay()+6)%7;
  if(wasToday)[week,day]=todayView();
  if($("sheet").hidden&&view==="sched")render();
}
setInterval(tick,30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){tick();checkUpdate();flushQueue();if(view==="me")loadMe()}});
window.addEventListener("online",()=>flushQueue(true));

const APP_VERSION="2026-10-28-2";
let lastCheck=0;
async function checkUpdate(){
  if(location.protocol!=="https:"||Date.now()-lastCheck<20000||!$("sheet").hidden)return;
  lastCheck=Date.now();
  try{const r=await fetch(location.pathname+"?v="+Date.now(),{cache:"no-store"});if(!r.ok)return;
    const m=(await r.text()).match(/APP_VERSION="([^"]+)"/);if(m&&m[1]!==APP_VERSION)location.reload();}catch(e){}
}
if("serviceWorker" in navigator&&location.protocol==="https:"){try{navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}}

setView(view);
if(navigator.onLine!==false)checkUpdate();
})();
</script>
